<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Seesanierung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">Seesanierung <small id="level-name"></small></h1>
    <div id="hud">
      <span>Tag <b id="h-day"></b> <small id="h-left"></small></span>
      <span>Geld <b id="h-money"></b> <small id="h-income"></small></span>
      <span>Sauber <b id="h-clean"></b></span>
      <span>Abgenommen <b id="h-acc"></b></span>
      <span>Puffer <b id="h-buf"></b></span>
      <span>Rekord <b id="h-best">–</b></span>
    </div>
  </header>

  <main>
    <section id="stage">
      <canvas id="canvas"></canvas>
      <div id="hints" aria-label="Steuerung"></div>
      <div id="shift-hud" hidden>
        <span id="s-mode"></span>
        <span><b id="s-removed"></b></span>
        <span>Trübung <progress id="s-turb" max="1" value="0"></progress></span>
        <span>Schieflage <progress id="s-tilt" max="1" value="0"></progress></span>
      </div>
      <div id="shift-actions" hidden>
        <button id="btn-anchor" class="primary">⚓ Anker werfen (E)</button>
        <div id="row-box" aria-label="Zeile des Kastens"></div>
        <button id="btn-leave">↩ Zurück zur Karte (Q)</button>
        <button id="btn-auto">🤖 Automatik an (T)</button>
        <button id="btn-fix" class="primary">🔧 Reset (R)</button>
        <button id="btn-pump">🌀 Pumpe: AUS (Leertaste)</button>
        <button id="btn-sound">🔊 Ton an (M)</button>
        <button id="btn-drone-auto" hidden>🤖 Drohnen-Automatik</button>
        <button id="btn-drone2">🛸 Drohne ausbringen (V)</button>
        <button id="btn-recall" class="primary">↩ Drohne einholen (Q)</button>
        <label id="spd-box" hidden>Tempo <input id="spd" type="range" min="0.2" max="1" step="0.05" value="1"> <b id="spd-val">100%</b> <small>(Z/X)</small></label>
        <label id="cut-box" hidden>Abtrag <input id="cut" type="range" min="0.1" max="1.5" step="0.05" value="1"> <b id="cut-val">1.00 m</b> <small>(F/G)</small></label>
      </div>
      <button id="btn-pause2" aria-label="Pause">⏸</button>
      <div id="toast"></div>
      <div id="overlay"></div>
      <div id="bruno" hidden></div>
      <div id="touch-ui" hidden>
        <div id="stick" aria-label="Steuerkreuz"><div id="knob"></div></div>
        <div id="dpad" hidden aria-label="Pfeiltasten für die Pumpe">
          <button class="dp up" data-dir="up" aria-label="Pumpe hoch">↑</button>
          <button class="dp left" data-dir="left" aria-label="Pumpe links">←</button>
          <button class="dp right" data-dir="right" aria-label="Pumpe rechts">→</button>
          <button class="dp down" data-dir="down" aria-label="Pumpe runter">↓</button>
        </div>
        <button id="act" class="primary">⚓ Anker</button>
      </div>
    </section>

    <aside id="panel">
      <button id="panel-handle">▲ Anlage &amp; Ausrüstung</button>
      <h2>Anlage an Land</h2>
      <div id="plant">
        <div>Puffer: <b id="p-stock"></b> / <span id="p-cap"></span> m³</div>
        <progress id="p-prog" max="1" value="0"></progress>
        <div>Durchsatz: <span id="p-thru"></span> m³/s · Restvolumen nach Pressen: <span id="p-dew"></span></div>
        <div>Chargen-Lotto: <span id="p-lotto"></span></div>
        <div>Bisher: <span id="p-classes"></span></div>
        <label><input type="checkbox" id="chk-oc"> <span id="p-oc"></span></label>
        <label><input type="checkbox" id="chk-bruno" checked> Bauleiter Bruno gibt Tipps (B)</label>
      </div>
      <h2>Nachträge</h2>
      <div id="claims"></div>
      <h2>Zertifikate</h2>
      <div id="certs"></div>
      <h2>Funde</h2>
      <div id="finds"></div>
      <h2>Zusatzaufträge</h2>
      <div id="jobs"></div>
      <div id="crane-offer"></div>
      <div id="upgrades"></div>
      <button id="btn-drone" class="primary">Drohne tauchen lassen</button>
      <button id="btn-pause">⏸ Pause (P)</button>
      <button id="btn-sound2">🔊 Ton an (M)</button>
      <h2>Journal</h2>
      <ul id="log"></ul>
    </aside>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
